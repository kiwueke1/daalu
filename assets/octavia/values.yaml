images:
  tags:
    bootstrap: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    db_init: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    db_drop: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    octavia_db_sync: docker.io/loci/octavia:master-ubuntu
    rabbit_init: docker.io/rabbitmq:3.13-management
    ks_user: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    ks_service: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    ks_endpoints: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    octavia_api: docker.io/loci/octavia:master-ubuntu
    octavia_worker: docker.io/loci/octavia:master-ubuntu
    octavia_housekeeping: docker.io/loci/octavia:master-ubuntu
    octavia_health_manager: docker.io/loci/octavia:master-ubuntu
    # kolla/ubuntu-source-octavia-health-manager:rocky no longer publicly available;
    # replaced with openstack-client which provides the openstack CLI needed by the
    # octavia-health-manager-get-port.sh init script.
    octavia_health_manager_init: quay.io/airshipit/openstack-client:2025.1-ubuntu_noble
    # kolla/centos-source-openvswitch-vswitchd:rocky is obsolete;
    # replaced with the openstack-helm OVS image which provides ovs-vsctl.
    openvswitch_vswitchd: docker.io/openstackhelm/openvswitch:latest-ubuntu_jammy

manifests:
  ingress_api: false
  service_ingress_api: false
