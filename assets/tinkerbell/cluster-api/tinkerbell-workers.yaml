apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: ${ CLUSTER_NAME }-workers
  namespace: ${ NAMESPACE }
  labels:
    cluster.x-k8s.io/cluster-name: ${ CLUSTER_NAME }
spec:
  clusterName: ${ CLUSTER_NAME }
  replicas: ${ WORKER_MACHINE_COUNT }
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ${ CLUSTER_NAME }
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: ${ CLUSTER_NAME }
    spec:
      clusterName: ${ CLUSTER_NAME }
      version: ${ KUBERNETES_VERSION }
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: ${ CLUSTER_NAME }-workers
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: TinkerbellMachineTemplate
        name: ${ CLUSTER_NAME }-workers
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: TinkerbellMachineTemplate
metadata:
  name: ${ CLUSTER_NAME }-workers
  namespace: ${ NAMESPACE }
spec:
  template:
    spec:
      templateOverride: |
        version: "0.1"
        name: ubuntu-kubeadm-worker
        global_timeout: 1800
        tasks:
          - name: "stream-image"
            worker: "{{.device_1}}"
            volumes:
              - /dev:/dev
              - /dev/console:/dev/console
              - /lib/firmware:/lib/firmware:ro
            actions:
              - name: image2disk
                image: ghcr.io/tinkerbell/actions/image2disk:v0.1.0
                timeout: 600
                environment:
                  IMG_URL: "${ IMAGE_URL }"
                  DEST_DISK: "/dev/sda"
                  COMPRESSED: "true"
              - name: reboot
                image: ghcr.io/tinkerbell/actions/reboot:v0.1.0
                timeout: 90
                volumes:
                  - /worker:/worker
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: ${ CLUSTER_NAME }-workers
  namespace: ${ NAMESPACE }
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            cloud-provider: external
      users:
        - name: ${ IMAGE_USERNAME }
          sudo: "ALL=(ALL) NOPASSWD:ALL"
          sshAuthorizedKeys:
            - ${ SSH_PUB_KEY_CONTENT }
