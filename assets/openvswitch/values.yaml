images:
  tags:
    openvswitch_db_server: docker.io/openstackhelm/openvswitch:latest-ubuntu_jammy
    openvswitch_vswitchd: docker.io/openstackhelm/openvswitch:latest-ubuntu_jammy

pod:
  security_context:
    ovs:
      pod:
        runAsUser: 0
      container:
        perms:
          runAsUser: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        server:
          runAsUser: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        modules:
          runAsUser: 0
          capabilities:
            add:
              - SYS_MODULE
              - SYS_CHROOT
          readOnlyRootFilesystem: true
        vswitchd:
          runAsUser: 0
          capabilities:
            add:
              - NET_ADMIN

conf:
  ovs_user_name: "root:root"
  # Create br-ex on every node at OVS DaemonSet startup.
  # eno1 is NOT added here because it is still enslaved to the Metal3
  # provisioning Linux bridge at deploy time.  The provisioning bridge
  # migration (OpenvSwitchComponent.post_install) detaches eno1 from the
  # Linux bridge and adds it to br-ex once the DaemonSet is running.
  auto_bridge_add:
    br-ex: null
