[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-console"
version = "0.1.0"
description = "Friendly operator UI for Temporal — brand- and namespace-configurable, reusable across projects"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    # Temporal SDK
    "temporalio>=1.6.0",
    # OIDC / Keycloak auth
    "authlib>=1.3.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.4",
]

[project.scripts]
temporal-console = "temporal_console.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
temporal_console = [
    "registry.json",
    "api/templates/*.j2",
    "api/templates/_partials/*.j2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
