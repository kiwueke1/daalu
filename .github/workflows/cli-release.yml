# Build the standalone `daalu` CLI binaries and publish a GitHub Release.
#
# Triggers on a `cli-v*` tag (e.g. `cli-v0.1.0`). Builds one-file PyInstaller
# binaries for Linux/macOS/Windows × x64/arm64, tars/zips them with a sha256,
# attaches everything to the Release, then refreshes the Homebrew tap formula.
#
# The headline installer (get.daalu.io/install.sh) downloads these Release
# assets — see cli/packaging/install.sh and the engineering handbook chapter
# "The Daalu CLI" for the full distribution story.
name: Release daalu CLI

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the cli-v prefix)"
        required: true

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.os_label }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, os_label: linux, arch: x64, ext: tar.gz }
          - { runner: ubuntu-24.04-arm, os_label: linux, arch: arm64, ext: tar.gz }
          - { runner: macos-13, os_label: macos, arch: x64, ext: tar.gz }
          - { runner: macos-14, os_label: macos, arch: arm64, ext: tar.gz }
          - { runner: windows-latest, os_label: windows, arch: x64, ext: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CLI + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ./cli pyinstaller
      - name: Build one-file binary
        working-directory: cli
        run: pyinstaller packaging/daalu.spec --distpath dist --workpath build
      - name: Package (POSIX)
        if: matrix.ext == 'tar.gz'
        run: |
          cd cli/dist
          tar -czf "daalu-${{ matrix.os_label }}-${{ matrix.arch }}.tar.gz" daalu
          shasum -a 256 "daalu-${{ matrix.os_label }}-${{ matrix.arch }}.tar.gz" \
            > "daalu-${{ matrix.os_label }}-${{ matrix.arch }}.tar.gz.sha256"
      - name: Package (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          cd cli/dist
          Compress-Archive -Path daalu.exe -DestinationPath "daalu-windows-${{ matrix.arch }}.zip" -Force
          (Get-FileHash "daalu-windows-${{ matrix.arch }}.zip" -Algorithm SHA256).Hash.ToLower() `
            | Out-File "daalu-windows-${{ matrix.arch }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: daalu-${{ matrix.os_label }}-${{ matrix.arch }}
          path: |
            cli/dist/*.tar.gz
            cli/dist/*.zip
            cli/dist/*.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          generate_release_notes: true

  # A separate job (kept here as documentation of intent) regenerates the
  # Homebrew tap formula and publishes the PyPI package. It needs a tap deploy
  # key + PyPI token in repo secrets; enable once those exist.
  publish-managers:
    name: refresh homebrew + pypi
    needs: release
    if: ${{ vars.DAALU_PUBLISH_MANAGERS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build + upload sdist/wheel to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install build twine
          python -m build ./cli
          twine upload cli/dist/*.whl cli/dist/*.tar.gz
      - name: Note
        run: echo "Homebrew formula update runs in the daalu-io/homebrew-tap repo via repository_dispatch."
