apiVersion: apps/v1
kind: Deployment
metadata:
  name: daalu-redis
  namespace: daalu-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daalu-redis
  template:
    metadata:
      labels:
        app: daalu-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: daalu-redis
  namespace: daalu-automation
spec:
  selector:
    app: daalu-redis
  ports:
    - port: 6379
      targetPort: 6379
