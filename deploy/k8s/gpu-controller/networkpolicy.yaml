apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gpu-controller-ingress
  namespace: daalu-automation
  labels:
    app: gpu-controller
    app.kubernetes.io/part-of: daalu-automation
spec:
  podSelector:
    matchLabels:
      app: gpu-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: daalu-api
              app.kubernetes.io/part-of: daalu-automation
        - podSelector:
            matchLabels:
              app: daalu-worker
              app.kubernetes.io/part-of: daalu-automation
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8084
          protocol: TCP
