apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautobot-controller
  namespace: daalu-automation
  labels:
    app: nautobot-controller
    app.kubernetes.io/part-of: daalu-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nautobot-controller
  template:
    metadata:
      labels:
        app: nautobot-controller
        # Required to match the daalu-postgres-ingress NetworkPolicy `from`
        # selectors (the daalu-automation kustomize base stamps this
        # part-of label on them via commonLabels). Without it this
        # controller's DB connection is silently blocked by default-deny.
        app.kubernetes.io/part-of: daalu-automation
    spec:
      serviceAccountName: daalu-nautobot-controller
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: controller
          image: ghcr.io/kiwueke1/daalu-automation:93b7ef50fb03c98d979f938333e28e67cf348103
          imagePullPolicy: IfNotPresent
          command: ["daalu", "nautobot-controller", "--port", "8082"]
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            # Needs DATABASE_URL (the controller's reconcile loop reads
            # nautobot_tenants from the same DB as daalu-api), plus
            # SERVICE_TOKEN_SECRET_KEY to verify daalu-api's calls and
            # FIELD_ENCRYPTION_KEY to encrypt/decrypt the per-tenant
            # bootstrap credentials it persists.
            - secretRef:
                name: daalu-automation-secrets
          readinessProbe:
            httpGet: { path: /healthz, port: 8082 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nautobot-controller
  namespace: daalu-automation
  labels:
    app: nautobot-controller
spec:
  selector:
    app: nautobot-controller
  ports:
    - name: http
      port: 80
      targetPort: 8082
