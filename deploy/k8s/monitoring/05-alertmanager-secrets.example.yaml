# Secret material referenced by Alertmanager config.
# Copy to 05-alertmanager-secrets.yaml, populate, and apply.
# .gitignore the populated copy.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
type: Opaque
stringData:
  slack_webhook_url: "https://hooks.slack.com/services/PUT-YOURS-HERE"
  pagerduty_routing_key: "PUT-YOUR-PAGERDUTY-INTEGRATION-KEY"
