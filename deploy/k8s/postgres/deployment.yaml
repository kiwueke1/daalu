apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: daalu-postgres-data
  namespace: daalu-automation
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: daalu-postgres
  namespace: daalu-automation
spec:
  serviceName: daalu-postgres
  replicas: 1
  selector:
    matchLabels:
      app: daalu-postgres
  template:
    metadata:
      labels:
        app: daalu-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: daalu_automation
            - name: POSTGRES_USER
              value: daalu
            - name: POSTGRES_PASSWORD
              value: daalu_password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "daalu"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: daalu-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: daalu-postgres
  namespace: daalu-automation
spec:
  clusterIP: None
  selector:
    app: daalu-postgres
  ports:
    - port: 5432
      targetPort: 5432
