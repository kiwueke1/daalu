apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautobot-redis
  namespace: nautobot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nautobot-redis
  template:
    metadata:
      labels:
        app: nautobot-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nautobot-redis
  namespace: nautobot
spec:
  selector:
    app: nautobot-redis
  ports:
    - port: 6379
      targetPort: 6379
