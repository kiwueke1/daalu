apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: daalu-api
  namespace: daalu-automation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: daalu-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    # CPU is the primary driver — the API is mostly I/O-bound but
    # spikes when many users open the dashboard simultaneously.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Memory as a guard so we don't run hot replicas at 95 % heap.
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom: scale up if the per-pod HTTP request rate sustained
    # exceeds 50 req/s. Requires the Prometheus Adapter to be
    # installed — see deploy/k8s/monitoring/install.sh for the
    # optional helm install. If absent, this metric is ignored.
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
