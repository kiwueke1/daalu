# Argo Application for the nautobot-controller.
#
# Independent of the daalu-automation app so a controller bug can't
# wedge the hub API. The controller pod itself lives in
# daalu-automation; its RBAC is cluster-scoped (to create per-tenant
# namespaces) — see deploy/k8s/nautobot-controller/rbac.yaml for the
# blast-radius details.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nautobot-controller
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: daalu
  source:
    repoURL: https://github.com/kiwueke1/daalu
    targetRevision: main
    path: deploy/k8s/nautobot-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: daalu-automation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
