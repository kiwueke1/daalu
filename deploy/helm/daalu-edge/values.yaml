# daalu-edge — customer-side WireGuard endpoint
#
# Every field under `cluster:` and `hub:` and `bootstrap:` is filled
# in by the install snippet the operator's UI generates at onboarding.
# You can also wire these to a sealed-secret if you prefer not to type
# the invite token directly on the command line.

image:
  repository: ghcr.io/kiwueke1/daalu-edge
  tag: latest
  pullPolicy: IfNotPresent

# Operator API the edge calls /clusters/{slug}/callback against on first
# boot. Should include scheme; trailing slash is stripped. The install
# snippet generated by the operator UI always sets this — leave the
# default empty so a regressed snippet (missing --set operator.apiUrl)
# fails loud in entrypoint.sh rather than dialing a wrong host.
operator:
  apiUrl: ""

cluster:
  # DNS-style identifier the operator typed at onboarding time.
  slug: ""
  # /32 the operator allocated for this cluster on 10.200.0.0/16.
  tunnelIp: ""

hub:
  # host:port — the operator's wireguard-hub Service or NodePort.
  endpoint: ""
  # WireGuard pubkey baked into the install snippet by the operator UI.
  publicKey: ""

bootstrap:
  # One-shot invite token. Cleared after a successful callback; if the
  # PVC is wiped and the edge restarts, the operator must issue a new
  # cluster row (i.e. re-onboard) to mint a fresh token.
  token: ""

# State volume — holds the wg keypair so a pod restart doesn't make the
# hub see a new pubkey. Defaults to a 16Mi emptyDir backed by a
# persistentVolumeClaim if persistence.enabled.
persistence:
  enabled: true
  size: 64Mi
  # Empty = use the cluster's default StorageClass.
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

# Most customer clusters won't have a dedicated egress node, so leave
# this empty and let the scheduler pick. Set if you want the edge pod
# pinned (e.g. to a node with a stable public IP).
nodeSelector: {}
tolerations: []
affinity: {}

# Edge needs hostNetwork OFF and just NET_ADMIN+NET_RAW — wg-quick brings
# wg0 up inside the pod's netns, then routes 10.200.0.0/16 across the
# tunnel from there.
podSecurityContext: {}
containerSecurityContext:
  capabilities:
    add: [NET_ADMIN, NET_RAW]

# Optional: tell the hub a routable host:port for us. Most customer
# clusters sit behind NAT, so leave this empty and the tunnel is
# initiated outbound from the edge (PersistentKeepalive opens the
# pinhole).
ourPublicEndpoint: ""

# API-server reverse proxy. The wireguard tunnel routes packets to
# this pod's wg0 address (cluster.tunnelIp), but the customer's
# kube-apiserver doesn't listen there — it sits on the in-cluster
# Service `kubernetes.default.svc.cluster.local:443`. This sidecar
# forwards TCP from `tunnelIp:listenPort` into that Service so the
# operator's daalu-api can `kubectl` against the customer cluster
# using a kubeconfig with `server: https://<tunnelIp>:6443`.
#
# TLS passes through end-to-end (the proxy speaks raw TCP, the kube
# apiserver's certificate is unchanged). The operator-side kubeconfig
# must either use `insecure-skip-tls-verify: true` (the current default,
# since the apiserver cert won't include the tunnel IP in its SAN list)
# or supply a CA that signed a cert with the tunnel IP as a SAN — see
# §0.10 of docs/cluster-tunnel-feature.md.
apiserverProxy:
  enabled: true
  # Image is a plain socat container — no daalu-specific build required.
  image: alpine/socat:1.8.0.0
  imagePullPolicy: IfNotPresent
  # Port the proxy listens on. Match this with the kubeconfig's
  # `server: https://<tunnelIp>:<listenPort>`.
  listenPort: 6443
  # Address to forward to. The in-cluster Service of the customer's
  # kube-apiserver. Override if the customer has a non-standard layout.
  upstream: kubernetes.default.svc.cluster.local:443
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

# Dynamic HTTP forward proxy. Listens on the pod's wg0 address
# (cluster.tunnelIp) at `edgeProxy.listenPort` and forwards arbitrary
# HTTP and HTTPS-via-CONNECT to in-cluster Services. The hub's daalu-api
# uses this as an `httpx` proxy whenever an Integration row has
# `cluster_tunnel_id` set, so a customer can paste an in-cluster URL
# like `http://prometheus.monitoring.svc.cluster.local:9090` into the
# Prometheus integration without exposing it publicly.
#
# Auth model: tunnel-IP-only listener + WireGuard mesh = trust boundary.
# Same precedent as apiserverProxy and serviceProxies above. The proxy
# refuses dial-outs to public hosts by default (allowedHosts regex) so
# a compromised hub can't turn the edge into an exfiltration relay.
#
# Listen port must be unique across apiserverProxy.listenPort and every
# serviceProxies[].listenPort — they all bind in the same pod netns.
edgeProxy:
  enabled: true
  # Reuses the daalu-edge image (it ships python3 + aiohttp + proxy.py).
  # No separate build artifact.
  listenPort: 8888
  # Regex matched against the upstream host on every request. Default
  # allows only in-cluster DNS (`*.svc[.cluster.local]`) and RFC1918
  # IPs. Set to ".*" to allow any host (not recommended).
  allowedHosts: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Generic in-cluster services exposed on the tunnel. Each entry renders
# one additional socat sidecar in the edge pod that listens on
# `tunnelIp:<listenPort>` and forwards raw TCP to `<upstream>`. Same
# pattern as apiserverProxy above — no TLS termination, no rewriting.
#
# Primary use case is federating local GPU / inference services from
# this cluster onto the operator's WireGuard mesh, so the operator-side
# daalu-api can reach `http://<tunnelIp>:<listenPort>` as if NIM were a
# Service in its own cluster. See docs/nvidia-strategy.md Appendix B.
#
# Each listenPort must be unique across both apiserverProxy.listenPort
# and every other serviceProxies[].listenPort — they all bind in the
# same pod netns (the one that owns wg0).
#
# Example:
#   serviceProxies:
#     - name: nim
#       listenPort: 8000
#       upstream: llm-classifier.daalu.svc.cluster.local:80
#     # DCGM is scraped per GPU NODE: the exporter ClusterIP load-balances to
#     # one pod per scrape, so a single proxy only surfaces one node. Point one
#     # proxy at each node's exporter via the nvidia-dcgm-exporter-nodes NodePort
#     # (externalTrafficPolicy: Local) at <nodeInternalIP>:30940.
#     - name: dcgm-gpu-node-1
#       listenPort: 9400
#       upstream: <node-ip>:30940
#     - name: dcgm-gpu-node-3
#       listenPort: 9401
#       upstream: <node-ip>:30940
serviceProxies: []

# Self-registration of this cluster's kubeconfig with the hub.
#
# When enabled the chart creates a ServiceAccount + long-lived token Secret,
# and the edge includes that token in the bootstrap callback it already makes.
# The hub assembles the kubeconfig (server = the tunnel IP's apiserver-proxy)
# and stores it as the cluster's Integration(provider="kubernetes") — so the
# operator never pastes one, and a rebuilt cluster re-registers itself instead
# of leaving a stale credential that 401s at the next provision.
#
# Disable only if you intend to manage that Integration by hand.
kubeRegistration:
  enabled: true
  serviceAccountName: daalu-edge
  # See the note in templates/rbac.yaml — cluster-admin is parity with the
  # hand-pasted kubeconfig this replaces. Point at a scoped ClusterRole to
  # tighten it (the hub degrades gracefully: features whose verbs are denied
  # fail individually rather than the registration failing as a whole).
  clusterRole: cluster-admin

# Defaults applied to every serviceProxies[] entry unless the entry
# overrides them with its own `image`/`imagePullPolicy`/`resources`.
serviceProxyDefaults:
  image: alpine/socat:1.8.0.0
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

# Daalu Private — edge-side agent host.
#
# When `agents.enabled=true`, this chart deploys a `daalu-edge-agents`
# pod that runs the orchestration agent loop *inside the customer
# cluster*. The hub stops running agents for tenants flagged
# `edge_agents_enabled` and the edge pod picks them up via the
# long-poll internal API. Tool-call results never transit the hub —
# only the agent's final synthesised message goes back.
#
# Set `enabled=true` only after the operator has flipped
# `tenant.edge_agents_enabled=true` for this tenant on the hub.
# Otherwise both ends will try to run the agent loop and you'll get
# duplicate side-effects.
#
# See docs/design/daalu-private.md.
# Daalu Private — edge data plane.
#
# When `tenantData.enabled=true`, this chart deploys
# `daalu-edge-data` (the same daalu backend image with
# --mode=edge), wires it to a local Postgres (bundled below or
# bring-your-own), and runs an alembic migration Job on first
# install. The hub's EdgeForwardMiddleware then proxies all
# tenant-scoped API requests for this tenant to the edge-data pod
# via the WireGuard tunnel.
#
# Set `enabled=true` only after the operator has provisioned this
# tenant as Private (full sovereignty) on the hub. The hub
# Settings page issues the `serviceToken` cleartext + `tenantId`
# you paste below.
#
# See docs/design/edge-data-plane.md and book-customer §44.
tenantData:
  enabled: false
  # Same image as the hub's daalu-api, different entrypoint
  # (`daalu server --mode=edge`).
  image:
    repository: ghcr.io/kiwueke1/daalu-automation
    tag: latest
    pullPolicy: IfNotPresent
  # Pull secret for the customer's cluster. Required when the
  # image is on a private registry (default: ghcr.io/kiwueke1).
  # Provision the secret separately and reference it by name here.
  imagePullSecret: ghcr
  # Tenant UUID this edge is provisioned for. The edge auth
  # boundary refuses any service token whose tenant claim does not
  # match this value — protects against a hub-side bug that
  # misroutes requests cross-tenant.
  tenantId: ""
  # Cleartext of the service-token signing key. The hub stores
  # only its sha256 hash. Issued by the hub at Private-tier
  # provisioning; shown to the operator exactly once.
  serviceToken: ""
  # Used only when postgres.enabled=false (bring-your-own).
  # Format: postgresql+asyncpg://user:pass@host:5432/db
  dbUrl: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  networkPolicy:
    enabled: true
    # Extra app labels that may reach the edge-data pod. Empty
    # for prod; add "kubectl-debug" or similar in dev if you need
    # to curl the pod directly.
    allowedFromApps: []

# Bundled Postgres for Daalu Private. Disable and set
# `tenantData.dbUrl` to point at a managed Postgres (RDS / CNPG /
# Cloud SQL) for production deployments — see §3.6 of the design
# doc for the trade-offs.
postgres:
  enabled: false
  image: postgres:16-alpine
  user: daalu
  database: daalu_edge
  # MUST be set on first install if postgres.enabled=true. Don't
  # commit to git — pass via --set or values-override.
  password: ""
  storage: 50Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi

agents:
  enabled: false
  # Same image as the hub's daalu-api, different entrypoint
  # (`daalu agents --mode=edge`). The tenant's daalu-edge pull secret
  # must be able to fetch this — usually the customer's GHCR/PAT or
  # an internal registry mirror they've configured.
  image:
    repository: ghcr.io/kiwueke1/daalu-automation
    tag: latest
    pullPolicy: IfNotPresent
  # Per-tenant service token used to authenticate the agents pod to
  # the hub's internal API (long-poll for agent-tasks, POST results).
  # Issued by the hub at Private-tier provisioning time and stored in
  # a K8s Secret in the edge namespace.
  serviceTokenSecretName: daalu-edge-agent-token
  # URL of the hub's internal API. Defaults to operator.apiUrl above
  # if empty — that's almost always what you want.
  hubInternalApiUrl: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
