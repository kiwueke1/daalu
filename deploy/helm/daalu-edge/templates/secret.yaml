{{- include "daalu-edge.required" . -}}
# Bootstrap token + hub identity. The token is one-shot — the edge
# pod marks $STATE_DIR/.bootstrapped after a successful callback and
# the operator clears the row's invite_token_hash, so a leaked Secret
# can only be redeemed once.
apiVersion: v1
kind: Secret
metadata:
  name: daalu-edge-bootstrap
  labels: {{- include "daalu-edge.labels" . | nindent 4 }}
type: Opaque
stringData:
  BOOTSTRAP_TOKEN: {{ .Values.bootstrap.token | quote }}
  HUB_PUBLIC_KEY: {{ .Values.hub.publicKey | quote }}
