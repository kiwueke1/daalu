apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-controller
  labels:
    app: workspace-controller
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: workspace-controller }
  template:
    metadata:
      labels:
        app: workspace-controller
        # Match daalu-postgres-ingress / daalu-redis-ingress so the
        # controller's DB connection isn't default-denied.
        app.kubernetes.io/part-of: daalu-automation
    spec:
      serviceAccountName: daalu-workspace-controller
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      containers:
        - name: controller
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["daalu", "workspace-controller", "--port", "8081"]
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DAALU_WORKSPACES_NAMESPACE
              value: {{ .Values.workspacesNamespace | quote }}
            # Namespace the secret-mirror reads the signing key from —
            # the controller's own (release) namespace.
            - name: DAALU_HUB_NAMESPACE
              value: {{ .Release.Namespace | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-controller
  labels:
    app: workspace-controller
spec:
  selector:
    app: workspace-controller
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-controller-ingress
spec:
  podSelector:
    matchLabels: { app: workspace-controller }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedFromApps }}
        - podSelector:
            matchLabels: { app: {{ . }} }
        {{- end }}
      ports:
        - protocol: TCP
          port: 8081
{{- end }}
