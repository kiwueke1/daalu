apiVersion: apps/v1
kind: Deployment
metadata:
  name: daalu-frontend
  labels:
    {{- include "daalu.labels" . | nindent 4 }}
    app: daalu-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: daalu-frontend
  template:
    metadata:
      labels:
        app: daalu-frontend
        {{- include "daalu.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: frontend
          image: {{ include "daalu.frontendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # In-cluster, the frontend's Next rewrites proxy /api/* to
            # the API service.
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "http://daalu-api.{{ .Release.Namespace }}.svc.cluster.local"
            - name: NODE_ENV
              value: production
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: daalu-frontend
  labels: {{- include "daalu.labels" . | nindent 4 }}
spec:
  selector:
    app: daalu-frontend
  ports:
    - port: 80
      targetPort: 3000
