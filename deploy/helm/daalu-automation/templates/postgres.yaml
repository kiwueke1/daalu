{{- if .Values.postgres.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: daalu-postgres-data
  labels: {{- include "daalu.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.postgres.storageClass }}
  storageClassName: {{ .Values.postgres.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: daalu-postgres
  labels:
    {{- include "daalu.labels" . | nindent 4 }}
    app: daalu-postgres
spec:
  serviceName: daalu-postgres
  replicas: 1
  selector:
    matchLabels:
      app: daalu-postgres
  template:
    metadata:
      labels:
        app: daalu-postgres
        {{- include "daalu.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: daalu-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: daalu-postgres
  labels: {{- include "daalu.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: daalu-postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
