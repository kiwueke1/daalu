apiVersion: apps/v1
kind: Deployment
metadata:
  name: daalu-worker
  labels:
    {{- include "daalu.labels" . | nindent 4 }}
    app: daalu-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: daalu-worker
  template:
    metadata:
      labels:
        app: daalu-worker
        {{- include "daalu.labels" . | nindent 8 }}
    spec:
      {{- if .Values.remediator.enabled }}
      # Worker runs celery tasks that talk to the API server: the
      # wireguard-health beat task execs into the daalu-wireguard-hub
      # pod for `wg show wg0 dump`, and core.kube_tools tasks may
      # patch/read shared cluster state. RBAC is granted to the
      # daalu-remediator SA in templates/remediator-rbac.yaml and the
      # wireguard-coordinator RoleBinding in
      # templates/wireguard-hub.yaml.
      serviceAccountName: {{ .Values.remediator.serviceAccountName }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      securityContext:
        {{- include "daalu.podSecurityContext" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "daalu.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["daalu", "worker", "--concurrency={{ .Values.worker.concurrency }}"]
          envFrom:
            {{- include "daalu.envFrom" . | nindent 12 }}
          env:
            {{- include "daalu.commonEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daalu-beat
  labels:
    {{- include "daalu.labels" . | nindent 4 }}
    app: daalu-beat
spec:
  # Beat MUST stay 1 — multiple schedulers fire duplicate tasks.
  replicas: {{ .Values.beat.replicas }}
  selector:
    matchLabels:
      app: daalu-beat
  template:
    metadata:
      labels:
        app: daalu-beat
        {{- include "daalu.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      securityContext:
        {{- include "daalu.podSecurityContext" . | nindent 8 }}
      containers:
        - name: beat
          image: {{ include "daalu.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["daalu", "beat"]
          envFrom:
            {{- include "daalu.envFrom" . | nindent 12 }}
          env:
            {{- include "daalu.commonEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.beat.resources | nindent 12 }}
---
