{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daalu-ingress
  labels: {{- include "daalu.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tlsEnabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsEnabled }}
  tls:
    - hosts: [{{ .Values.ingress.host }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    # An empty host matches any hostname (handy for a local kind install).
    - http:
        paths:
          # /api routes hit the backend FastAPI — REST + the SSE feed.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: daalu-api
                port:
                  number: 80
          # /health is convenient for external monitoring.
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: daalu-api
                port:
                  number: 80
          # Everything else is the Next.js frontend (Server-Side rendering + static).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: daalu-frontend
                port:
                  number: 80
      {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
{{- end }}
