{{- if .Values.redis.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daalu-redis
  labels:
    {{- include "daalu.labels" . | nindent 4 }}
    app: daalu-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daalu-redis
  template:
    metadata:
      labels:
        app: daalu-redis
        {{- include "daalu.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args:
            - "--maxmemory"
            - {{ .Values.redis.maxmemory | quote }}
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: daalu-redis
  labels: {{- include "daalu.labels" . | nindent 4 }}
spec:
  selector:
    app: daalu-redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
