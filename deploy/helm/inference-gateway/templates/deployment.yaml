apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  labels:
    app: inference-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: inference-gateway }
  template:
    metadata:
      labels: { app: inference-gateway }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      containers:
        - name: gateway
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["daalu", "inference-gateway", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DAALU_HOSTED_UPSTREAM_URL
              value: {{ .Values.upstream.url | quote }}
            - name: DAALU_HOSTED_UPSTREAM_API_KEY
              value: {{ .Values.upstream.apiKey | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
  labels:
    app: inference-gateway
spec:
  selector:
    app: inference-gateway
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
{{- if .Values.networkPolicy.enabled }}
---
# Default-deny then explicit allow — only the app labels listed in
# values.yaml's `allowedFromApps` can call the gateway. This is the
# wire-level second layer behind the service-token JWT.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-gateway-ingress
spec:
  podSelector:
    matchLabels: { app: inference-gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedFromApps }}
        - podSelector:
            matchLabels: { app: {{ . }} }
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
