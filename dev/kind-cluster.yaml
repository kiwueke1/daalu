# Kind cluster for the Kubernetes install of Daalu (Method 2 in
# docs/getting-started.md). One node, so the WireGuard hub (hostNetwork)
# can schedule on the control plane without taint juggling.
#
# Port mappings publish the node's ports on the host:
#   8080/tcp  → ingress-nginx (the Daalu UI + API)
#   8443/tcp  → ingress-nginx TLS (unused on a plain-HTTP install)
#   51820/udp → the WireGuard hub, dialled by clusters you add to Daalu

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: daalu-dev
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true,daalu.io/wireguard-hub=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      # bootstrap.sh rewrites listenAddress to DAALU_HOST_IP: with a wildcard
      # bind, Docker's UDP proxy answers another kind cluster on this host
      # from the bridge gateway, and that cluster's NAT drops the reply.
      - containerPort: 51820
        hostPort: 51820
        protocol: UDP
        listenAddress: "0.0.0.0"
