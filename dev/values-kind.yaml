# Helm values for installing Daalu on the local kind cluster
# (dev/bootstrap.sh → `make bootstrap-dev`). Images are built locally and
# loaded into the kind node, so nothing is pulled from a registry.
image:
  registry: docker.io/library
  backend:
    repository: daalu-automation
    tag: local
  frontend:
    repository: daalu-automation-frontend
    tag: local
  pullPolicy: Never

ingress:
  className: nginx
  host: ""            # any hostname: http://localhost:8080, http://<host-ip>:8080
  tlsEnabled: false

networkPolicies:
  ingressNamespace: ingress-nginx

config:
  environment: development
  corsOrigins: '["http://localhost:8080"]'
  daaluHostedGatewayUrl: ""
  workspaceControllerUrl: ""
  keycloakIssuerUrl: ""
  keycloakHubRedirectUrl: ""
  keycloakHubPostLogoutUrl: ""
  keycloakAdminBaseUrl: ""
  ensureKeycloakSsoJob: false

api:
  replicas: 1
worker:
  replicas: 1
agents:
  replicas: 1
frontend:
  replicas: 1
postgres:
  storage: 5Gi

wireguard:
  enabled: true
  image: docker.io/library/daalu-wg-hub:local
  # hubPrivateKey is generated by dev/bootstrap.sh on first install.
