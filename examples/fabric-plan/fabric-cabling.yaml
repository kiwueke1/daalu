# Spectrum-X fabric — CABLING. What is plugged into what.
#
# E02 left an INVENTORY: twelve devices, each with one `mgmt0` interface
# and nothing else. This is the first of the three files that turn that
# into a MODEL — the fabric ports each box actually has, and the thirty-two
# links between them.
#
# Upload this one FIRST. A cable can only terminate on an interface that
# already exists, and fabric-addressing.yaml can only place an address on
# an interface that already exists.
#
# GENERATED by make-fabric-plan.py from spectrum-x.clab.yml — do not
# hand-edit. The plan and the lab must agree on every port name, or the
# topology map reports miscables that are really typos. Change the clab
# file, then regenerate.

# `kind` is what Daalu reads to know which importer to run. Upload this
# at Operations → Bulk import; the tab is chosen for you from this line.
kind: cabling

meta:
  site: lab-site
  namespace: Global
  generated_from: spectrum-x.clab.yml

# --- Interfaces --------------------------------------------------------
# Derived from the links below, so the two can never disagree. `lo` is
# added to every switch: it carries the BGP router-id and the VXLAN source,
# and the render fails outright without it.
interfaces:
  spine1:
    - {name: swp1, type: 10gbase-x-sfpp}
    - {name: swp2, type: 10gbase-x-sfpp}
    - {name: swp3, type: 10gbase-x-sfpp}
    - {name: swp4, type: 10gbase-x-sfpp}
    - {name: swp5, type: 10gbase-x-sfpp}
