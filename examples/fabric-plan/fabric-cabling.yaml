# --- Cables ------------------------------------------------------------
# The 32 fabric links. Each one is a single object with two ends; neither
# end is the `from` end. This is what makes a miscable detectable at all:
# the model stops describing what was SEEN and starts stating what SHOULD
# be — and only a claim can be violated.
cables:
  # compute fabric: GPU-N of every server homes to rail switch N
  - [gpu1:eth1, leaf1:swp1]
  - [gpu2:eth1, leaf1:swp2]
  - [gpu3:eth1, leaf1:swp3]
  - [gpu4:eth1, leaf1:swp4]
  - [gpu1:eth2, leaf2:swp1]
  - [gpu2:eth2, leaf2:swp2]
  - [gpu3:eth2, leaf2:swp3]
  - [gpu4:eth2, leaf2:swp4]
  - [gpu1:eth3, leaf3:swp1]
  - [gpu2:eth3, leaf3:swp2]
  - [gpu3:eth3, leaf3:swp3]
  - [gpu4:eth3, leaf3:swp4]
  - [gpu1:eth4, leaf4:swp1]
  - [gpu2:eth4, leaf4:swp2]
  - [gpu3:eth4, leaf4:swp3]
  - [gpu4:eth4, leaf4:swp4]

  # storage fabric: storage NICs and the storage node
  - [gpu1:eth5, storleaf1:swp1]
  - [gpu2:eth5, storleaf1:swp2]
  - [gpu3:eth5, storleaf1:swp3]
  - [gpu4:eth5, storleaf1:swp4]
  - [stor1:eth1, storleaf1:swp5]
  - [stor1:eth2, storleaf1:swp6]

  # leaf <-> spine: full Clos mesh, every leaf to both spines
  - [leaf1:swp11, spine1:swp1]
  - [leaf1:swp12, spine2:swp1]
  - [leaf2:swp11, spine1:swp2]
  - [leaf2:swp12, spine2:swp2]
  - [leaf3:swp11, spine1:swp3]
  - [leaf3:swp12, spine2:swp3]
  - [leaf4:swp11, spine1:swp4]
  - [leaf4:swp12, spine2:swp4]
  - [storleaf1:swp11, spine1:swp5]
  - [storleaf1:swp12, spine2:swp5]
