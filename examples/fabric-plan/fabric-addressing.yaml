# Spectrum-X fabric — ADDRESSING. The numbers a config contains.
#
# A config is mostly numbers, so if you want a config to come out, the
# numbers have to be in here.
#
# An address is its own object with two parents: the interface that uses
# it, and the prefix it came out of. That second edge is the difference
# between a list of addresses and an allocator.
#
# Upload this AFTER fabric-cabling.yaml — every address below lands on an
# interface that file creates.
#
# GENERATED by make-fabric-plan.py from spectrum-x.clab.yml — do not
# hand-edit. The plan and the lab must agree on every port name, or the
# topology map reports miscables that are really typos. Change the clab
# file, then regenerate.

# `kind` is what Daalu reads to know which importer to run. Upload this
# at Operations → Bulk import; the tab is chosen for you from this line.
kind: addressing

meta:
  site: lab-site
  namespace: Global
  generated_from: spectrum-x.clab.yml

# --- Prefixes ----------------------------------------------------------
prefixes:
  - {prefix: 10.0.0.0/24, description: fabric loopbacks}
  - {prefix: 10.1.0.0/24, description: leaf-spine point-to-point}

# --- Loopbacks ---------------------------------------------------------
# Loopback octet mirrors the mgmt octet (172.20.20.21 -> 10.0.0.21), so a
# router-id is readable straight off the management address.
loopbacks:
  - {device: spine1, interface: lo, address: 10.0.0.11/32}
  - {device: spine2, interface: lo, address: 10.0.0.12/32}
  - {device: leaf1, interface: lo, address: 10.0.0.21/32}
  - {device: leaf2, interface: lo, address: 10.0.0.22/32}
  - {device: leaf3, interface: lo, address: 10.0.0.23/32}
  - {device: leaf4, interface: lo, address: 10.0.0.24/32}
  - {device: storleaf1, interface: lo, address: 10.0.0.25/32}

# --- Point-to-point ----------------------------------------------------
# One /31 per leaf<->spine link. Spine side takes the even address, leaf
# side the odd.
point_to_point:
  - {device: spine1, interface: swp1, address: 10.1.0.0/31}
  - {device: leaf1, interface: swp11, address: 10.1.0.1/31}
  - {device: spine2, interface: swp1, address: 10.1.0.2/31}
  - {device: leaf1, interface: swp12, address: 10.1.0.3/31}
  - {device: spine1, interface: swp2, address: 10.1.0.4/31}
  - {device: leaf2, interface: swp11, address: 10.1.0.5/31}
  - {device: spine2, interface: swp2, address: 10.1.0.6/31}
  - {device: leaf2, interface: swp12, address: 10.1.0.7/31}
  - {device: spine1, interface: swp3, address: 10.1.0.8/31}
  - {device: leaf3, interface: swp11, address: 10.1.0.9/31}
  - {device: spine2, interface: swp3, address: 10.1.0.10/31}
  - {device: leaf3, interface: swp12, address: 10.1.0.11/31}
  - {device: spine1, interface: swp4, address: 10.1.0.12/31}
  - {device: leaf4, interface: swp11, address: 10.1.0.13/31}
  - {device: spine2, interface: swp4, address: 10.1.0.14/31}
  - {device: leaf4, interface: swp12, address: 10.1.0.15/31}
  - {device: spine1, interface: swp5, address: 10.1.0.16/31}
  - {device: storleaf1, interface: swp11, address: 10.1.0.17/31}
  - {device: spine2, interface: swp5, address: 10.1.0.18/31}
  - {device: storleaf1, interface: swp12, address: 10.1.0.19/31}
