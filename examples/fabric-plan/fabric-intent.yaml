# Spectrum-X fabric — INTENT. What `correct` means for these boxes.
#
# Note the shape: this is JSON-ish structured data, NOT config. It never
# says `nv set interface swp1`. The config is what you get when you point
# a template at this.
#
# Independent of the other two files — it touches no interface and no
# cable — so it can be uploaded at any point.
#
# GENERATED by make-fabric-plan.py from spectrum-x.clab.yml — do not
# hand-edit. The plan and the lab must agree on every port name, or the
# topology map reports miscables that are really typos. Change the clab
# file, then regenerate.

# `kind` is what Daalu reads to know which importer to run. Upload this
# at Operations → Bulk import; the tab is chosen for you from this line.
kind: intent

meta:
  site: lab-site
  namespace: Global
  generated_from: spectrum-x.clab.yml

# --- Roles -------------------------------------------------------------
# A role is a template SELECTOR, not a label: it picks a directory in the
# Cumulus template tree (cumulus-linux/<role>/<firmware>/...). E02 imported
# these switches as `spine`/`leaf`, which match no directory — and a role
# that matches nothing renders zero files with NO ERROR. So restate them
# using the tree's own names.
roles:
  spine1: Spine-Common
  spine2: Spine-Common
  leaf1: Leaf-Common
  leaf2: Leaf-Common
  leaf3: Leaf-Common
  leaf4: Leaf-Common
  storleaf1: Storage-Leaf

# --- Config contexts ---------------------------------------------------
# Scoped to the ROLE, not to a device, which is why intent stays DRY: write
# the leaf policy once and every leaf inherits it. It is the one
# relationship in the model that is one-to-many rather than a single
# pointer.
#
# All three keys are load-bearing. Without intended-firmware the render
# silently produces nothing; without fabric-mac or password_mappings it
# raises a FilterException.
config_contexts:
  - name: leaf-common-intent
    scope: {role: Leaf-Common, location: lab-site}
    data:
      intended-firmware:
        version: '5.13.1'
      fabric-mac: '44:38:39:ff:00:00'
      password_mappings:
        cumulus: lab-cumulus-password

  - name: spine-common-intent
    scope: {role: Spine-Common, location: lab-site}
    data:
      intended-firmware:
        version: '5.13.1'
      fabric-mac: '44:38:39:ff:00:00'
      password_mappings:
        cumulus: lab-cumulus-password

  - name: storage-leaf-intent
    scope: {role: Storage-Leaf, location: lab-site}
    data:
      intended-firmware:
        version: '5.13.1'
      fabric-mac: '44:38:39:ff:00:00'
      password_mappings:
        cumulus: lab-cumulus-password
