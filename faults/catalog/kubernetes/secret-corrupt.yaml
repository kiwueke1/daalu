id: secret-corrupt
title: Change one secret key, then restart the workload that reads it
description: >-
  The classic config push: one value in a secret (a DB password, a connection
  string, a whole config file) changes and the workload restarts onto it. The
  pod template is unchanged, so rolling back the workload does NOT fix it.
scope: cluster
blast: workload
params:
  kind: {type: enum, choices: [deployment, statefulset, daemonset], default: deployment}
  name: {type: name, help: "The workload that reads the secret"}
  namespace: {type: name}
  object: {type: name, help: "The secret name"}
  key: {type: token}
  value: {type: token, default: rotated-but-not-applied}
inject:
  - snapshot: "secret/${object}"
  - kubectl: [patch, "secret/${object}", -n, "${namespace}", --type, merge, -p, '{"stringData":{"${key}":"${value}"}}']
  - kubectl: [rollout, restart, "${kind}/${name}", -n, "${namespace}"]
revert:
  - kubectl: [rollout, restart, "${kind}/${name}", -n, "${namespace}"]
check:
  kubectl: [rollout, status, "${kind}/${name}", -n, "${namespace}", --timeout=5s]
warning: The Secret's original contents are kept in your local journal (mode 0600) so revert can restore them.
expect:
  root_cause: a value in the secret changed and the restarted pods read it
  fix: restore the value, then restart; a rollback of the workload does not help
