id: service-selector-mismatch
title: Service selector no longer matches any pod
description: Adds a label to the Service selector that no pod carries. Pods are healthy; the Service has no endpoints.
scope: cluster
blast: service
params:
  service: {type: name}
  namespace: {type: name}
  label: {type: token, default: app.kubernetes.io/version}
  value: {type: token, default: v2}
inject:
  - snapshot: "service/${service}"
  - kubectl: [patch, "service/${service}", -n, "${namespace}", --type, merge, -p, '{"spec":{"selector":{"${label}":"${value}"}}}']
check:
  kubectl: [get, endpoints, "${service}", -n, "${namespace}", -o, "jsonpath={.subsets[0].addresses[0].ip}"]
  match: "[0-9a-f]"
expect:
  symptoms: [connection refused / 503 through the Service, pods all Running and Ready, empty Endpoints]
  root_cause: the Service selector was changed and selects no pods
  fix: restore the Service selector
